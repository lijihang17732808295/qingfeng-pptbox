name: Build macOS App

# 触发方式：
#   1. 推送到 main            → 跑一遍，验证能在 macOS runner 上打出 .app
#   2. 推送 v* 标签（如 v1.07）→ 额外创建 Release 并附上 zip
#   3. 手动 Run workflow       → 随时重跑
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，只保留最新一次，避免排队烧时长
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PY_VERSION: '3.12'
  APP_NAME: PPT工具箱

jobs:
  # ---------------------------------------------------------------- 语法闸门
  # 在便宜的 linux runner 上先跑一遍编译，语法错就不用排队等 macOS 机器
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: 编译全部模块
        run: |
          python -m compileall -q -x '[\\/](\.venv|build|dist)[\\/]' .
          echo "全部 .py 语法通过"

  # ---------------------------------------------------------------- 打包
  build:
    name: 打包 ${{ matrix.arch }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    # macos-13（Intel）随时可能被 GitHub 下线，允许它失败而不拖垮整个流程
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # Apple Silicon（M1 起）
            arch: arm64
            experimental: false
          - runner: macos-13      # Intel（x86_64）
            arch: x86_64
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
          cache-dependency-path: requirements-mac.txt

      # PyInstaller 打窗口程序必须有 tkinter。setup-python 的 macOS 构建一般自带，
      # 万一没有就退回 Homebrew 版本（python-tk 是独立 formula，要单独装）
      - name: 确认 tkinter 可用
        run: |
          set -euo pipefail
          if python3 -c "import tkinter; print('tkinter', tkinter.TkVersion)"; then
            echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          else
            echo "::warning::当前 Python 缺少 tkinter，改用 Homebrew 版本"
            brew install "python@${PY_VERSION}" "python-tk@${PY_VERSION}"
            echo "PYTHON=$(brew --prefix "python@${PY_VERSION}")/bin/python${PY_VERSION}" >> "$GITHUB_ENV"
          fi

      # 直接走用户文档里的那一条命令，等于顺带验证脚本本身没坏
      - name: 打包 .app
        run: bash build_mac.sh

      - name: 校验产物
        env:
          CI_REPORT: ${{ runner.temp }}/ci-probe.txt
        run: |
          set -euo pipefail
          APP="dist/${APP_NAME}.app"
          BIN="${APP}/Contents/MacOS/${APP_NAME}"

          test -d "$APP" || { echo "::error::没有生成 $APP"; exit 1; }
          test -x "$BIN" || { echo "::error::可执行文件缺失：$BIN"; exit 1; }

          # ad-hoc 签名校验（不验证公证，CI 里没有开发者证书）
          codesign --verify --deep --strict "$APP"

          # 在真实产物上跑一次探针：资源释放、路径解析、字体目录、内嵌样本
          echo "—— 打包产物自检 ——"
          "$BIN" --ci || status=$?
          cat "$CI_REPORT" || true
          [ "${status:-0}" -eq 0 ] || { echo "::error::产物自检未通过"; exit 1; }

          du -sh "$APP"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: PPT-Toolbox-macOS-${{ matrix.arch }}
          path: dist/PPT工具箱-mac.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- 发布
  # 只有打 v* 标签才走这里，把两个架构的 zip 挂到 Release
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理安装包
        run: |
          set -euo pipefail
          mkdir -p out
          for d in artifacts/*/; do
            name=$(basename "$d")                 # PPT-Toolbox-macOS-arm64
            arch=${name##*-}                      # arm64
            src="$d/PPT工具箱-mac.zip"
            [ -f "$src" ] || continue
            cp "$src" "out/PPT工具箱-${GITHUB_REF_NAME}-macOS-${arch}.zip"
          done
          ls -lh out
          test -n "$(ls -A out)" || { echo "::error::没有可发布的安装包"; exit 1; }

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "macOS 版安装包。下载对应的架构：

          - Apple Silicon（M1/M2/M3/M4）→ \`arm64\`
          - Intel → \`x86_64\`

          解压后把「PPT工具箱.app」拖进「应用程序」。首次打开若提示「无法验证开发者」，
          右键 → 打开；或执行 \`xattr -dr com.apple.quarantine /Applications/PPT工具箱.app\`。

          > 仅供学习交流，请勿用于商业用途。" \
            || gh release upload "$GITHUB_REF_NAME" out/*.zip --clobber
