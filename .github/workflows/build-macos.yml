name: Build macOS App

# 触发方式：
#   1. 推送到 main            → 只打 arm64，验证能在 macOS runner 上出 .app
#   2. 推送 v* 标签（如 v1.07）→ 追加打 x86_64，并创建 Release 附上两个 zip
#   3. 手动 Run workflow       → 同标签（双架构），不发版
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时只保留最新一次，避免排队烧额度
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: PPT工具箱

jobs:
  # ---------------------------------------------------------------- 语法闸门
  # 在便宜的 linux runner 上先跑一遍编译，语法错就不用排队等 macOS 机器
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 编译全部模块
        run: |
          python -m compileall -q -x '[\\/](\.venv|build|dist)[\\/]' .
          echo "全部 .py 语法通过"

  # ---------------------------------------------------------------- 打包
  # 拆成两个 job 而不是用 matrix：job 级 if 里拿不到 matrix 上下文
  # （GitHub 在展开矩阵之前就求值了），而 Intel 只在特定情况下构建。
  arm64:
    name: 打包 arm64
    needs: lint
    # 注意：不要写 macos-14。实测该标签在本仓库会被解析成
    # macos-14-arm64-us-xl（XL 规格，需付费套餐），job 在分配机器前就被判掉，
    # 报错 "The configuration 'macos-14-arm64-us-xl' is not supported"。
    # macos-15 / macos-latest 都能正常拿到 arm64 标准机。
    runs-on: macos-15          # Apple Silicon（M1 起）
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mac
        with:
          arch: arm64

  # Intel 只在打 tag / 手动触发时构建。仓库已转公开，Actions 不再计费，
  # 但 macos-13 队列极长（实测排队十几分钟不动）、且是 GitHub 即将下线的镜像，
  # 所以不放进日常 push 的关键路径。
  intel:
    name: 打包 x86_64
    needs: lint
    runs-on: macos-13          # Intel
    timeout-minutes: 40
    continue-on-error: true    # 旧镜像随时可能下线，不拖垮整个流程
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-mac
        with:
          arch: x86_64

  # ---------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: [arm64, intel]
    # always() 是必须的：intel 在非 tag 时被 skip，不加它这里也会跟着跳过
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.arm64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理安装包
        run: |
          set -euo pipefail
          mkdir -p out
          for d in artifacts/*/; do
            name=$(basename "$d")                 # PPT-Toolbox-macOS-arm64
            arch=${name##*-}                      # arm64
            src="$d/PPT工具箱-mac.zip"
            [ -f "$src" ] || continue
            cp "$src" "out/PPT工具箱-${GITHUB_REF_NAME}-macOS-${arch}.zip"
          done
          ls -lh out
          test -n "$(ls -A out)" || { echo "::error::没有可发布的安装包"; exit 1; }

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "macOS 版安装包。下载对应的架构：

          - Apple Silicon（M1/M2/M3/M4）→ \`arm64\`
          - Intel → \`x86_64\`

          解压后把「PPT工具箱.app」拖进「应用程序」。首次打开若提示「无法验证开发者」，
          右键 → 打开；或执行 \`xattr -dr com.apple.quarantine /Applications/PPT工具箱.app\`。

          > 仅供学习交流，请勿用于商业用途。" \
            || gh release upload "$GITHUB_REF_NAME" out/*.zip --clobber
