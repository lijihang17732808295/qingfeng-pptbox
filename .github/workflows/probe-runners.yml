name: 探针 · 可用 runner
on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-14, macos-13]
    steps:
      - name: 看规格
        run: |
          uname -m
          sw_vers -productVersion
          sysctl -n hw.ncpu
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
